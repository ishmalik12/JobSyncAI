<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Match your resume with relevant job opportunities and understand your skill fit." />
    <meta name="theme-color" content="#f5f7fb" />
    <title>JobSync AI | Resume to Opportunity Matching</title>
    <script>
      (() => {
        try {
          const saved = localStorage.getItem("jobsync-theme");
          const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.dataset.theme = saved === "light" || saved === "dark" ? saved : (prefersDark ? "dark" : "light");
        } catch {
          document.documentElement.dataset.theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
